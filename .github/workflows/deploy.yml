name: Deploy to Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test --if-present

      - name: Deploy to Render
        if: success()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          else
            echo "Render deploy hook not set"
          fi

      - name: Deploy to Vercel
        if: success()
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          else
            echo "Vercel deploy hook not set"
          fi

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Deployment Status - ${{ job.status }}
          body: |
            Build status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          to: mudassir@vervhq.com
          from: deployment@verv.com
          ignore_cert: true
          secure: true
