services:
  - type: web
    name: verv-bms-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
    autoDeploy: true
    branch: main
